# Render Blueprint — https://render.com/docs/blueprint-spec
# Deploy: New → Blueprint → connect this repo
#
# RAM: free/starter are often 512MB. YOLO needs every optimization we enable
# via ROBOVISION_LOW_MEM=1. If it still OOMs, upgrade to Standard (2GB).

services:
  - type: web
    name: robovision
    runtime: docker
    plan: starter
    region: oregon
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /
    envVars:
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: STREAMLIT_BROWSER_GATHER_USAGE_STATS
        value: "false"
      - key: ROBOVISION_LOW_MEM
        value: "1"
      - key: OMP_NUM_THREADS
        value: "1"
      - key: MKL_NUM_THREADS
        value: "1"
      - key: OPENBLAS_NUM_THREADS
        value: "1"
      - key: MALLOC_ARENA_MAX
        value: "2"
      - key: CUDA_VISIBLE_DEVICES
        value: ""
